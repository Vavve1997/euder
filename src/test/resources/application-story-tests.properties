# H2: gebruik kleine letters voor databaseobjecten.
spring.datasource.url=jdbc:h2:mem:eurder-story-tests;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway maakt het schema en voert de migraties uit.
spring.flyway.enabled=true
spring.flyway.default-schema=eurder
spring.flyway.schemas=eurder

# Hibernate gebruikt hetzelfde schema en controleert de mapping.
spring.jpa.properties.hibernate.default_schema=eurder
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false